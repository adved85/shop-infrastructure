server {
    listen 80;
    server_name  localhost;

    location / {
        proxy_pass http://frontend:80;
    }

    location = /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Probe endpoints, reachable only from inside this container (the health
    # response reveals which backing services are down — not public info).
    # Read timeout sits above ReadinessChecker's own 3s per-dependency timeout,
    # so Laravel gets to answer 503 with detail rather than nginx cutting it
    # off with a 504.
    location = /health/live {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 5s;
        access_log off;
    }

    location = /health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 5s;
        access_log off;
    }

    location /api/ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }
}