name: shop

# Laravel's database connection, defined once and shared by `api` and `migrate`
# so the two can never point at different databases.
x-db-env: &db-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB}
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}

services:
  redis:
    image: redis:8-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    restart: always
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

  postgres:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data

  proxy:
    image: nginx:1.31-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - type: bind
        source: ./proxy/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - 80:80
      - 443:443
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
  
  api:
    image: ghcr.io/adved85/laravel-shop-api:${API_VERSION}
    restart: unless-stopped
    # image: docker.io/adved85/laravel-shop-api:${API_VERSION}
    healthcheck:
      # Timeout must exceed ReadinessChecker's own 3s per-dependency timeout,
      # so a slow dependency reports a clean failure instead of being killed.
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      # Laravel refuses to encrypt/decrypt anything without this, but the
      # container still starts and health:check still passes without it —
      # so a missing APP_KEY fails silently at request time, not at boot.
      APP_KEY: ${APP_KEY}
      # Laravel's own logs go to stderr, so `docker compose logs api` shows them.
      LOG_CHANNEL: stderr

      <<: *db-env

      CACHE_STORE: redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      QUEUE_CONNECTION: rabbitmq
      # RABBITMQ_DEFAULT_* are the broker's variables for creating the user;
      # these are the different names Laravel reads to connect as it. Mapped
      # from the same two values so the two sides cannot drift apart.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: default
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: runs pending migrations, then exits. `api` won't start unless it
  # exits 0, so the app never runs against a half-migrated schema.
  migrate:
    image: ghcr.io/adved85/laravel-shop-api:${API_VERSION}
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/adved85/react-shop-client:${FRONTEND_VERSION}
    restart: unless-stopped
    # image: docker.io/adved85/react-shop-client:${FRONTEND_VERSION}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_started

volumes:
  redis-data:
  postgres_data:
  rabbitmq-lib:
  rabbitmq-log: